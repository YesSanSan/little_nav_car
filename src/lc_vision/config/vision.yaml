/lc_vision:
  ros__parameters:
    sdk_root: /home/cmls/sanwu/AstraSDK-v2.1.3-Ubuntu-x86_64/AstraSDK-v2.1.3-94bca0f52e-20210608T062039Z-Ubuntu18.04-x86_64

    rgb.enable: true
    rgb.width: 640
    rgb.height: 480
    rgb.capture_fps: 15
    rgb.publish_fps: 10
    rgb.bitrate_kbps: 1200
    rgb.gop_size: 30
    rgb.frame_id: cam_optical_frame

    depth.enable: true
    depth.width: 640
    depth.height: 480
    depth.capture_fps: 15
    depth.publish_fps: 8
    depth.bitrate_kbps: 500
    depth.gop_size: 24
    depth.frame_id: cam_optical_frame
    depth.visualization_min_mm: 300
    depth.visualization_max_mm: 10000
    depth.roi_min_valid_mm: 300
    depth.roi_max_valid_mm: 5000
    depth.invalid_as_black: true
    depth.enable_registration: true
    depth.estimation.min_valid_pixels: 50
    depth.estimation.histogram_bin_size_mm: 50
    depth.estimation.peak_min_ratio: 0.25
    depth.estimation.peak_min_count: 5
    depth.estimation.min_peak_pixels: 20
    depth.estimation.trim_ratio: 0.1
    depth.estimation.annotate_depth_on_rgb: true
    depth.estimation.annotate_depth_on_depth: true
    depth.debug_marker.enable: true
    depth.debug_marker.topic: ~/depth_debug_marker
    depth.debug_marker.frame_id: base_link
    depth.debug_marker.z: 0.05
    depth.debug_marker.line_width: 0.02
    depth.debug_marker.alpha: 0.9
    depth.debug_marker.use_detection_label_ns: true
    depth.debug_video.histogram.enable: false
    depth.debug_video.histogram.topic: ~/depth_histogram/video
    depth.debug_video.peak_mask.enable: false
    depth.debug_video.peak_mask.topic: ~/depth_peak_mask/video
    image.rotation_degrees: 90

    detector.enable: true
    detector.framework: auto
    detector.backend: auto
    detector.model_dir: ""
    detector.input_size: 640
    detector.score_threshold: 0.25
    detector.nms_threshold: 0.45
    detector.fps: 5
    detector.vulkan_device_index: 0
    detector.cpu_num_threads: 2
    detector.log_backend_info: true
    detector.target_classes: ["person"]

    tracking.enable: true
    tracking.initial_center_gate_ratio: 0.2
    tracking.max_lost_frames: 10
    tracking.min_iou_for_match: 0.05
    tracking.max_center_distance_px: 120.0
    tracking.max_depth_delta_mm: 800.0

    goal.enable: true
    goal.global_frame_id: map
    goal.robot_frame_id: base_link
    goal.costmap_topic: /global_costmap/costmap_raw
    goal.standoff_distance_m: 0.5
    goal.min_stable_frames: 3
    goal.clearance_radius_m: 0.25
    goal.max_cell_cost: 80
    goal.longitudinal_search_step_m: 0.05
    goal.max_backoff_distance_m: 1.5
    goal.lateral_search_step_m: 0.1
    goal.max_lateral_offset_m: 0.4
    goal.publish_debug_topics: true
