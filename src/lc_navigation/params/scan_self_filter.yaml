scan_self_filter:
  ros__parameters:
    input_scan_topic: /scan
    output_scan_topic: /scan_filtered
    base_frame: base_link
    x_min: -0.18
    x_max: 0.16
    y_min: -0.17
    y_max: 0.17
    transform_timeout_sec: 0.05
    marker_topic: /scan_self_filter/marker
    marker_publish_rate: 5.0
    marker_z: 0.03
    marker_line_width: 0.01
    marker_alpha: 0.2
    fixed_resolution_enabled: false
    fixed_resolution_bins: 450
    fixed_resolution_angle_min: 0.0
    fixed_resolution_use_full_circle: false
