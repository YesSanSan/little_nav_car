bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    map_topic: /map
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    
    # plugin_lib_names is used to add custom BT plugins to the executor (vector of strings).
    # Built-in plugins are added automatically
    # plugin_lib_names: []

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    # 控制器主循环频率。频率高，控制更跟手，但算力占用更高。
    controller_frequency: 20.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]

    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 15.0
    # Goal checker parameters
    #precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      # 到点判定容差。常用调参：
      # xy/yaw 越小，停得越准，但更容易在终点附近反复修正。
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.20
    # DWB parameters
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      # 线速度/角速度上下限。
      # 常用调参：觉得车整体偏慢时，优先看 max_vel_x / max_speed_xy / max_vel_theta。
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.40
      max_vel_y: 0.0
      max_vel_theta: 2.0
      min_speed_xy: 0.0
      max_speed_xy: 0.40
      # 原地旋转时的最小角速度。过小会显得转向“肉”，过大可能抖。
      min_speed_theta: 0.35
      # 加速度限制决定提速/起转有多猛。
      # 常用调参：起步慢、转起来慢，优先看 acc_lim_x / acc_lim_theta。
      acc_lim_x: 3.0
      acc_lim_y: 0.0
      acc_lim_theta: 5.0
      decel_lim_x: -3.0
      decel_lim_y: 0.0
      decel_lim_theta: -5.0
      # 轨迹采样密度，越高越细但计算更重。一般够用就不要盲目加。
      vx_samples: 24
      vy_samples: 5
      vtheta_samples: 32
      # 前向仿真时间。大了更保守、更平滑；小了更激进、更灵活。
      # 常用调参：觉得局部规划保守、拐弯慢，可以适当减小。
      sim_time: 0.8
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.10
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: True
      stateful: True
      # 这些 critic 权重直接决定“更贴路径”还是“更敢走、更敢转”。
      # 常用调参：
      # 1) 终点附近转得太保守：看 RotateToGoal.*
      # 2) 总想死跟路径导致速度起不来：看 PathAlign / PathDist
      # 3) 太贴障碍：看 BaseObstacle + 膨胀层
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 6.0
      PathAlign.forward_point_distance: 0.05
      GoalAlign.scale: 4.0
      GoalAlign.forward_point_distance: 0.05
      PathDist.scale: 24.0
      GoalDist.scale: 18.0
      RotateToGoal.scale: 56.0
      RotateToGoal.slowing_factor: 1.2
      RotateToGoal.lookahead_time: -1.0

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 20.0
      publish_frequency: 20.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      # 机器人外接圆半径。你的车直径 0.4 m，对应半径 0.20 m。
      # 如果底盘/雷达/外壳有外凸，建议保守设为 0.20~0.21，而不是更大。
      robot_radius: 0.20
      plugins: ["voxel_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 膨胀半径越大越保守，越容易贴着空旷区域中心走，也会显得慢。
        # 对 0.4 m 小车，0.30~0.35 常见；窄路多时可先试 0.30。
        cost_scaling_factor: 3.0
        inflation_radius: 0.30
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 20.0
      publish_frequency: 20.0
      global_frame: map
      robot_base_frame: base_link
      # 全局/局部 costmap 的车体尺寸要保持一致。
      robot_radius: 0.20
      resolution: 0.05
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          # '' keyword shall be replaced with 'namespace' where user defined.
          # It doesn't need to start with '/'
          topic: /scan_filtered
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.0
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.30
      always_send_full_costmap: True

# The yaml_filename does not need to be specified since it going to be set by defaults in launch.
# If you'd rather set it in the yaml, remove the default "map" value in the tb3_simulation_launch.py
# file & provide full path to map below. If CLI map configuration or launch default is provided, that will be used.
# map_server:
#   ros__parameters:
#     yaml_filename: "map.yaml"

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

